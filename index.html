<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد الفطر المبارك</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }
        @keyframes firework {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx, 50px), var(--ty, -100px)) scale(0); opacity: 0; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
            50% { box-shadow: 0 0 40px rgba(255,255,255,0.6), 0 0 60px rgba(138,43,226,0.4); }
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide React Icons as SVG components
        const Moon = ({ className, style }) => (
            <svg className={className} style={style} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        );

        const Star = ({ className, style }) => (
            <svg className={className} style={style} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
        );

        const Heart = ({ className, style }) => (
            <svg className={className} style={style} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
            </svg>
        );

        const Sparkles = ({ className, style }) => (
            <svg className={className} style={style} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
                <path d="M5 3v4"/>
                <path d="M19 17v4"/>
                <path d="M3 5h4"/>
                <path d="M17 19h4"/>
            </svg>
        );

        const Gift = ({ className, style }) => (
            <svg className={className} style={style} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <rect x="3" y="8" width="18" height="4" rx="1"/>
                <path d="M12 8v13"/>
                <path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/>
                <path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>
            </svg>
        );

        const Users = ({ className, style }) => (
            <svg className={className} style={style} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
        );

        const MessageCircle = ({ className, style }) => (
            <svg className={className} style={style} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
            </svg>
        );

        const EidFitrWebsite = () => {
            const [activeSection, setActiveSection] = useState('home');
            const [stars, setStars] = useState([]);
            const [showFireworks, setShowFireworks] = useState(false);

            useEffect(() => {
                const newStars = Array.from({ length: 50 }, (_, i) => ({
                    id: i,
                    left: Math.random() * 100,
                    top: Math.random() * 100,
                    delay: Math.random() * 3,
                    duration: 2 + Math.random() * 3
                }));
                setStars(newStars);

                const interval = setInterval(() => {
                    setShowFireworks(true);
                    setTimeout(() => setShowFireworks(false), 3000);
                }, 8000);

                return () => clearInterval(interval);
            }, []);

            const adeia = [
                {
                    title: "دعاء العيد",
                    text: "اللهم تقبل منا الصيام والقيام وصالح الأعمال، وبلغنا العيد أعوامًا عديدة",
                    icon: Moon
                },
                {
                    title: "دعاء الفرح",
                    text: "اللهم اجعل هذا العيد عيد خير وبركة، واجعله عيد فرح وسرور على جميع المسلمين",
                    icon: Heart
                },
                {
                    title: "دعاء القبول",
                    text: "اللهم تقبل منا ومنكم صالح الأعمال، واجعلنا من عتقائك من النار",
                    icon: Sparkles
                }
            ];

            const traditions = [
                {
                    title: "صلاة العيد",
                    description: "أداء صلاة العيد في المسجد أو المصلى",
                    icon: Moon,
                    color: "from-purple-500 to-pink-500"
                },
                {
                    title: "التكبير",
                    description: "التكبير من فجر يوم العيد حتى الصلاة",
                    icon: Star,
                    color: "from-blue-500 to-cyan-500"
                },
                {
                    title: "الزكاة",
                    description: "إخراج زكاة الفطر قبل صلاة العيد",
                    icon: Gift,
                    color: "from-green-500 to-emerald-500"
                },
                {
                    title: "صلة الرحم",
                    description: "زيارة الأهل والأقارب وتبادل التهاني",
                    icon: Users,
                    color: "from-orange-500 to-red-500"
                }
            ];

            return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-900 via-purple-900 to-pink-900 text-white overflow-hidden relative">
                    {/* Animated Stars Background */}
                    {stars.map(star => (
                        <div
                            key={star.id}
                            className="absolute rounded-full bg-white"
                            style={{
                                left: `${star.left}%`,
                                top: `${star.top}%`,
                                width: '2px',
                                height: '2px',
                                animation: `twinkle ${star.duration}s ease-in-out ${star.delay}s infinite`,
                                boxShadow: '0 0 4px 1px rgba(255,255,255,0.8)'
                            }}
                        />
                    ))}

                    {/* Fireworks Effect */}
                    {showFireworks && (
                        <div className="fixed inset-0 pointer-events-none z-50">
                            {[...Array(8)].map((_, i) => (
                                <div
                                    key={i}
                                    className="absolute w-2 h-2 rounded-full"
                                    style={{
                                        left: `${20 + i * 10}%`,
                                        top: `${20 + (i % 3) * 20}%`,
                                        background: ['#FFD700', '#FF69B4', '#00CED1', '#FF6347', '#9370DB'][i % 5],
                                        animation: `firework 1.5s ease-out forwards`,
                                        animationDelay: `${i * 0.1}s`,
                                        boxShadow: `0 0 20px 5px ${['#FFD700', '#FF69B4', '#00CED1', '#FF6347', '#9370DB'][i % 5]}`
                                    }}
                                />
                            ))}
                        </div>
                    )}

                    {/* Navigation */}
                    <nav className="relative z-10 backdrop-blur-md bg-white/10 border-b border-white/20">
                        <div className="max-w-7xl mx-auto px-4 py-4">
                            <div className="flex justify-between items-center">
                                <div className="flex items-center gap-3">
                                    <Moon className="w-8 h-8 text-yellow-300" style={{ animation: 'float 3s ease-in-out infinite' }} />
                                    <h1 className="text-2xl font-bold bg-gradient-to-r from-yellow-200 via-pink-200 to-purple-200 bg-clip-text text-transparent">
                                        عيد الفطر المبارك
                                    </h1>
                                </div>
                                <div className="flex gap-6">
                                    {['home', 'prayers', 'traditions', 'greetings'].map(section => (
                                        <button
                                            key={section}
                                            onClick={() => setActiveSection(section)}
                                            className={`px-4 py-2 rounded-full transition-all duration-300 ${
                                                activeSection === section
                                                    ? 'bg-gradient-to-r from-yellow-400 to-pink-400 text-gray-900 shadow-lg'
                                                    : 'hover:bg-white/20'
                                            }`}
                                        >
                                            {section === 'home' && 'الرئيسية'}
                                            {section === 'prayers' && 'الأدعية'}
                                            {section === 'traditions' && 'العادات'}
                                            {section === 'greetings' && 'التهاني'}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="relative z-10 max-w-7xl mx-auto px-4 py-12">
                        {activeSection === 'home' && (
                            <div style={{ animation: 'slideIn 0.6s ease-out' }}>
                                {/* Hero Section */}
                                <div className="text-center mb-16">
                                    <div className="inline-block mb-6" style={{ animation: 'glow 2s ease-in-out infinite' }}>
                                        <div className="relative">
                                            <Moon className="w-32 h-32 text-yellow-300 mx-auto" />
                                            <Star className="w-12 h-12 text-yellow-200 absolute -top-2 -right-2 animate-spin" style={{ animationDuration: '8s' }} />
                                            <Star className="w-8 h-8 text-pink-300 absolute -bottom-2 -left-2 animate-spin" style={{ animationDuration: '6s' }} />
                                        </div>
                                    </div>
                                    <h2 className="text-6xl font-bold mb-6 bg-gradient-to-r from-yellow-200 via-pink-200 to-purple-200 bg-clip-text text-transparent">
                                        عيد فطر مبارك
                                    </h2>
                                    <p className="text-3xl text-pink-200 mb-4">تقبل الله منا ومنكم صالح الأعمال</p>
                                    <p className="text-xl text-purple-200">كل عام وأنتم بخير وصحة وسعادة</p>
                                </div>

                                {/* Image Gallery */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-16">
                                    {[
                                        { gradient: 'from-purple-500 to-pink-500', icon: Moon, text: 'شهر رمضان المبارك' },
                                        { gradient: 'from-blue-500 to-cyan-500', icon: Star, text: 'ليلة القدر' },
                                        { gradient: 'from-green-500 to-emerald-500', icon: Gift, text: 'عيد الفطر السعيد' }
                                    ].map((item, i) => (
                                        <div
                                            key={i}
                                            className={`relative h-64 rounded-3xl bg-gradient-to-br ${item.gradient} p-8 overflow-hidden group cursor-pointer transform transition-all duration-300 hover:scale-105 hover:shadow-2xl`}
                                            style={{ animation: `slideIn 0.6s ease-out ${i * 0.2}s backwards` }}
                                        >
                                            <div className="relative z-10 h-full flex flex-col items-center justify-center">
                                                <item.icon className="w-24 h-24 mb-4 text-white opacity-80 group-hover:opacity-100 transition-opacity" />
                                                <p className="text-2xl font-bold text-center text-white">{item.text}</p>
                                            </div>
                                            <div className="absolute inset-0 bg-white/0 group-hover:bg-white/10 transition-all duration-300" />
                                            {[...Array(6)].map((_, j) => (
                                                <Sparkles
                                                    key={j}
                                                    className="absolute text-white/30"
                                                    style={{
                                                        left: `${20 + j * 15}%`,
                                                        top: `${10 + (j % 3) * 30}%`,
                                                        animation: `float ${3 + j * 0.5}s ease-in-out infinite`,
                                                        animationDelay: `${j * 0.3}s`
                                                    }}
                                                />
                                            ))}
                                        </div>
                                    ))}
                                </div>

                                {/* Traditions Grid */}
                                <h3 className="text-4xl font-bold text-center mb-10 bg-gradient-to-r from-yellow-200 to-pink-200 bg-clip-text text-transparent">
                                    سنن وعادات العيد
                                </h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                    {traditions.map((tradition, i) => (
                                        <div
                                            key={i}
                                            className="backdrop-blur-lg bg-white/10 rounded-2xl p-6 border border-white/20 hover:bg-white/20 transition-all duration-300 transform hover:scale-105 hover:shadow-2xl"
                                            style={{ animation: `slideIn 0.6s ease-out ${i * 0.1}s backwards` }}
                                        >
                                            <div className={`w-16 h-16 rounded-full bg-gradient-to-br ${tradition.color} flex items-center justify-center mb-4 mx-auto`}>
                                                <tradition.icon className="w-8 h-8 text-white" />
                                            </div>
                                            <h4 className="text-xl font-bold mb-2 text-center text-yellow-200">{tradition.title}</h4>
                                            <p className="text-purple-200 text-center">{tradition.description}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeSection === 'prayers' && (
                            <div style={{ animation: 'slideIn 0.6s ease-out' }}>
                                <h3 className="text-4xl font-bold text-center mb-12 bg-gradient-to-r from-yellow-200 to-pink-200 bg-clip-text text-transparent">
                                    أدعية العيد المباركة
                                </h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {adeia.map((dua, i) => (
                                        <div
                                            key={i}
                                            className="backdrop-blur-lg bg-white/10 rounded-3xl p-8 border border-white/20 hover:bg-white/20 transition-all duration-300 transform hover:scale-105"
                                            style={{ animation: `slideIn 0.6s ease-out ${i * 0.2}s backwards` }}
                                        >
                                            <div className="flex justify-center mb-6">
                                                <div className="w-20 h-20 rounded-full bg-gradient-to-br from-yellow-400 to-pink-400 flex items-center justify-center">
                                                    <dua.icon className="w-10 h-10 text-white" />
                                                </div>
                                            </div>
                                            <h4 className="text-2xl font-bold mb-4 text-center text-yellow-200">{dua.title}</h4>
                                            <p className="text-lg text-purple-200 text-center leading-relaxed">{dua.text}</p>
                                        </div>
                                    ))}
                                </div>
                                
                                {/* Additional Prayers */}
                                <div className="mt-12 backdrop-blur-lg bg-gradient-to-r from-purple-500/20 to-pink-500/20 rounded-3xl p-10 border border-white/20">
                                    <h4 className="text-3xl font-bold mb-6 text-center text-yellow-200">التكبيرات</h4>
                                    <p className="text-2xl text-center text-white leading-relaxed mb-4">
                                        الله أكبر الله أكبر الله أكبر
                                    </p>
                                    <p className="text-2xl text-center text-white leading-relaxed">
                                        لا إله إلا الله، الله أكبر الله أكبر ولله الحمد
                                    </p>
                                </div>
                            </div>
                        )}

                        {activeSection === 'traditions' && (
                            <div style={{ animation: 'slideIn 0.6s ease-out' }}>
                                <h3 className="text-4xl font-bold text-center mb-12 bg-gradient-to-r from-yellow-200 to-pink-200 bg-clip-text text-transparent">
                                    عادات وتقاليد عيد الفطر
                                </h3>
                                
                                <div className="space-y-6">
                                    {[
                                        { title: "الاغتسال والتطيب", desc: "من السنة الاغتسال ولبس أجمل الثياب والتطيب قبل الخروج لصلاة العيد", icon: Sparkles },
                                        { title: "الإفطار قبل الصلاة", desc: "يستحب الإفطار قبل الخروج لصلاة العيد بتمرات وتراً", icon: Moon },
                                        { title: "التكبير في الطريق", desc: "التكبير من البيت حتى المصلى، ويقطع بدخول الإمام", icon: Star },
                                        { title: "التهنئة بالعيد", desc: "تبادل التهاني والمعايدة بين المسلمين وزيارة الأهل والأحباب", icon: Heart },
                                        { title: "إدخال السرور", desc: "إدخال السرور على الأطفال بالهدايا والعيديات", icon: Gift },
                                        { title: "الصدقة والإحسان", desc: "التوسعة على الفقراء والمساكين في يوم العيد", icon: Users }
                                    ].map((item, i) => (
                                        <div
                                            key={i}
                                            className="backdrop-blur-lg bg-white/10 rounded-2xl p-6 border border-white/20 hover:bg-white/20 transition-all duration-300 flex items-start gap-4"
                                            style={{ animation: `slideIn 0.6s ease-out ${i * 0.1}s backwards` }}
                                        >
                                            <div className="w-14 h-14 rounded-full bg-gradient-to-br from-yellow-400 to-pink-400 flex items-center justify-center flex-shrink-0">
                                                <item.icon className="w-7 h-7 text-white" />
                                            </div>
                                            <div>
                                                <h4 className="text-2xl font-bold mb-2 text-yellow-200">{item.title}</h4>
                                                <p className="text-lg text-purple-200">{item.desc}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeSection === 'greetings' && (
                            <div style={{ animation: 'slideIn 0.6s ease-out' }}>
                                <h3 className="text-4xl font-bold text-center mb-12 bg-gradient-to-r from-yellow-200 to-pink-200 bg-clip-text text-transparent">
                                    عبارات التهنئة
                                </h3>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {[
                                        "عيد فطر مبارك، تقبل الله منا ومنكم صالح الأعمال",
                                        "كل عام وأنتم بخير، أعاده الله علينا وعليكم باليمن والبركات",
                                        "عيدكم مبارك، جعله الله عيد خير وسعادة عليكم",
                                        "تقبل الله طاعتكم، وأعاد علينا هذه الأيام بالخير والبركة",
                                        "عساكم من عواده، وكل عام وأنتم بصحة وعافية",
                                        "أسأل الله أن يجعل هذا العيد عيد فرح وسرور عليكم",
                                        "عيد مبارك على الجميع، أعاده الله علينا وعلى الأمة الإسلامية بالخير",
                                        "كل عام وأنتم أقرب إلى الله، عيد فطر سعيد"
                                    ].map((greeting, i) => (
                                        <div
                                            key={i}
                                            className="backdrop-blur-lg bg-gradient-to-br from-purple-500/20 to-pink-500/20 rounded-2xl p-6 border border-white/20 hover:bg-white/20 transition-all duration-300 transform hover:scale-105 flex items-center gap-4"
                                            style={{ animation: `slideIn 0.6s ease-out ${i * 0.1}s backwards` }}
                                        >
                                            <MessageCircle className="w-8 h-8 text-yellow-300 flex-shrink-0" />
                                            <p className="text-lg text-white">{greeting}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="mt-12 text-center backdrop-blur-lg bg-gradient-to-r from-yellow-400/20 to-pink-400/20 rounded-3xl p-10 border border-white/20">
                                    <Heart className="w-16 h-16 text-pink-300 mx-auto mb-4" style={{ animation: 'float 3s ease-in-out infinite' }} />
                                    <h4 className="text-3xl font-bold mb-4 text-yellow-200">من القلب</h4>
                                    <p className="text-2xl text-white leading-relaxed">
                                        نسأل الله أن يتقبل منا ومنكم صالح الأعمال، وأن يجعل عيدنا عيد فرح وسرور، 
                                        وأن يعيده علينا أعواماً عديدة ونحن في أحسن حال
                                    </p>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="relative z-10 backdrop-blur-md bg-white/10 border-t border-white/20 mt-20 py-8">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <div className="flex items-center justify-center gap-3 mb-4">
                                <Moon className="w-6 h-6 text-yellow-300" />
                                <Star className="w-5 h-5 text-pink-300" />
                                <Heart className="w-5 h-5 text-purple-300" />
                            </div>
                            <p className="text-purple-200 text-lg">
                                عيد فطر مبارك • تقبل الله منا ومنكم • {new Date().getFullYear()}
                            </p>
                        </div>
                    </footer>
                </div>
            );
        };

        ReactDOM.render(<EidFitrWebsite />, document.getElementById('root'));
    </script>
</body>
</html>
